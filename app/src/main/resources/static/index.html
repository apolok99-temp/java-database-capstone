<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>
    
    <!-- Favicon -->
    <link rel="icon" href="../assets/images/logo/Logo.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- JavaScript Files -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/components/header.js" defer></script>
    <script src="./components/footer.js" defer></script>
</head>
<body>
    <!-- Page Container -->
    <div class="container">
        <!-- Wrapper for Structure -->
        <div class="wrapper">
            <!-- Placeholder for Header (dynamically injected via JS) -->
            <div id="header"></div>

            <main class="main-content">
                <h2>Select Your Role</h2>
                
                <!-- Role Selection Buttons -->
                <div class="role-buttons">
                    <button id="btn-admin" class="dashboard-btn" onclick="handleRoleSelection('Admin')">Admin</button>
                    <button id="btn-doctor" class="dashboard-btn" onclick="handleRoleSelection('Doctor')">Doctor</button>
                    <button id="btn-patient" class="dashboard-btn" onclick="handleRoleSelection('Patient')">Patient</button>
                </div>
            </main>

            <!-- Placeholder for Footer (dynamically injected via JS) -->
            <div id="footer"></div>

        </div>
    </div>

    <!-- Modal Structure (Hidden by default) -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page-Specific Logic Module -->
    <script type="module" src="../js/services/index.js" defer></script>

</body>
</html>
