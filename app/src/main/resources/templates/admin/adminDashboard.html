<!-- adminDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Head Section and Character Encoding -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon using Thymeleaf pathing -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <!-- Page Title -->
    <title>Admin Dashboard</title>

    <!-- Link CSS Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- JavaScript Files with defer -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<!-- Body with onload event to trigger content rendering -->
<body onload="renderContent()">
    <!-- Container for layout control -->
    <div class="container">
        <!-- Wrapper for consistent spacing -->
        <div class="wrapper">
            <!-- Header to load the dynamic header -->
            <div id="header"></div>
            <!-- Main Section -->
            <main class="main-content">
                <!-- Search Bar -->
                <div class="search-container">
                    <input type="text" id="searchBar" placeholder="search by doctor name" />
                </div>
                <!-- Filter Dropdowns -->
                <div class="filter-wrapper">
                    <!-- Time Filter (AM/PM) -->
                    <select id="filterTime" class="filter-select">
                        <option value="">All Times</option>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>

                    <!-- Medical Specialty Filter -->
                    <select id="specialtyFilter" class="filter-select">
                        <option value="">All Specialties</option>
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Dentist">Dentist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Pediatrician">Pediatrician</option>
                    </select>
                </div>

                <!-- Content Display Area for dynamic injection -->
                <div id="content"></div>

            </main>

            <!-- Footer Placeholder -->
            <div id="footer"></div>

        </div> <!-- End Wrapper -->
    </div> <!-- End Container -->

    <!-- Modal Structure -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page-Specific JavaScript Modules -->
    <script type="module" src="../js/services/adminDashboard.js" defer></script>
    <script type="module" src="../js/components/doctorCard.js" defer></script>

</body> 
</html>
