<!-- doctorDashboard.html -->

<!DOCTYPE html>
<html lang="en" html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Set Character Encoding -->
    <meta charset="UTF-8">

    <!-- Set the Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <!-- Set the Page Title -->
    <title>Doctor Dashboard</title>

    <!-- Link CSS Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

    <!-- Link JavaScript Files (with defer) -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>

<body onload="renderContent()">

    <!-- Main Container -->
    <div class="container">
        
        <!-- Wrapper for Page Content -->
        <div class="wrapper">

            <!-- Header Placeholder -->
            <div id="header"></div>

            <!-- Main Content Area -->
            <div class="main-content">
                
                <!-- Search Bar -->
                <input type="text" id="searchBar" class="searchBar" placeholder="Search Patients" />

                <!-- Filter Controls -->
                <div class="filter-wrapper">
                    <button id="todayButton">Today's Appointments</button>
                    <input type="date" id="datePicker" class="input-field" />
                </div>

                <!-- Patient Table -->
                <table id="patientTable">
                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Phone No.</th>
                            <th>Email</th>
                            <th>Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Dynamic content will be inserted here via JavaScript -->
                    </tbody>
                </table>

            </div> <!-- End main-content -->

            <!-- Footer Placeholder -->
            <div id="footer"></div>

        </div> <!-- End wrapper -->

    </div> <!-- End container -->

</body>
</html>
